[project]
name = "object-reacquisition"
version = "0.1.0"
description = "Synthetic object reacquisition and safe approach challenge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gym-pybullet-drones",
    "mcap>=1.6.0",
    "pygame>=2.6",
]

[tool.uv.sources]
gym-pybullet-drones = { path = "external/gym-pybullet-drones", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fpv_sim*", "handin*"]

[tool.setuptools.package-data]
fpv_sim = ["assets/drone/*.urdf", "assets/drone/*.dae", "assets/drone/LICENSE", "assets/objects/*.urdf", "assets/objects/meshes/*.obj", "assets/terrains/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
